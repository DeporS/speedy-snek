[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "speedysnek"
description = "A small educational JIT compiler experiment for CPython."
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = [
    "pytest",
]
# Only for running the benchmark suite in ``benchmarks/``.
benchmarks = [
    "pyperf>=2.10,<3",
]

[tool.maturin]
python-source = "python"
module-name = "speedysnek._native"
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["python/tests", "benchmarks/tests"]
# Lets the benchmark tests import the benchmark helper modules.
pythonpath = ["benchmarks"]

[tool.ruff]
target-version = "py314"
src = ["python", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
