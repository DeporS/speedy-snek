[package]
name = "speedysnek"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
cranelift-codegen = "0.136.3"
cranelift-frontend = "0.136.3"
cranelift-jit = "0.136.3"
cranelift-module = "0.136.3"
cranelift-native = "0.136.3"

# Used by CI to build the extension for the test suite. Builds from scratch
# in about half the time of `release` while the tests run as fast, and keeps
# debug assertions and overflow checks on. Release wheels still use
# `release`.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = false
