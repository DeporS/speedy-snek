name: CI

# Branches are tested through their pull request, so a commit pushed to a PR
# runs CI once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its still-running checks. Runs on
# main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff format --check python benchmarks
          ruff check python benchmarks

  test:
    name: test (${{ matrix.os }}, CPython 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Caches the compiled dependencies (Cranelift, PyO3) in target/. A new
      # Cargo.lock or Rust release starts a fresh cache.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Builds with the `ci` profile from Cargo.toml instead of `release`.
      - name: Build and install
        env:
          MATURIN_PEP517_ARGS: --profile ci
        run: python -m pip install ".[tests,benchmarks]"
      # Includes the benchmark suite's correctness tests and a single-value
      # smoke run of each benchmark script. No timings are compared: the
      # full performance suite never runs in CI.
      - name: Test
        run: python -m pytest -v
